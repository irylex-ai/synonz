[package]
name = "synonz"
description = "Explicit, controllable, observable agent engineering infrastructure"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[features]
# Mock test doubles (MockModel etc.) for downstream agent testing.
# Not compiled by default; opt in via `--features test-util`.
test-util = []

[lints]
workspace = true

[dependencies]
futures.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
synonz-derive.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
# The observer tests exercise a slow observer running concurrently with the
# loop: that needs the multi-thread runtime flavor (test-only; downstream
# feature unification is not affected).
tokio = { workspace = true, features = ["rt-multi-thread"] }
