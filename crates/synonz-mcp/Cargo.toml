[package]
name = "synonz-mcp"
description = "MCP (Model Context Protocol) tool bridge for the Synonz agent framework"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
serde_json.workspace = true
synonz.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
schemars.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["io-util", "process"] }
