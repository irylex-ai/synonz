[workspace]
resolver = "2"
members = [
    "crates/synonz",
    "crates/synonz-derive",
    "crates/synonz-openai",
    "crates/synonz-anthropic",
    "crates/synonz-mcp",
    "examples",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

# Version catalog: referenced by member crates as `foo.workspace = true`.
# Entries are declarations only until a crate opts in.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wiremock = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
schemars = { version = "1.2", features = ["derive"] }
rmcp = { version = "3.1", default-features = false }
syn = "2"
quote = "1"
proc-macro2 = "1"
synonz = { path = "crates/synonz", version = "0.1.0" }
synonz-derive = { path = "crates/synonz-derive", version = "0.1.0" }
synonz-openai = { path = "crates/synonz-openai", version = "0.1.0" }
synonz-anthropic = { path = "crates/synonz-anthropic", version = "0.1.0" }
synonz-mcp = { path = "crates/synonz-mcp", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
